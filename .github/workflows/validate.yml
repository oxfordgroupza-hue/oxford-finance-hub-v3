name: Project validation

# GitHub-hosted runners are currently blocked before startup by the account
# billing/spending restriction. Netlify Deploy Previews run the same checks
# automatically and are the authoritative CI signal until billing is restored.
# Keep this manual workflow as a fallback; re-enable PR/push triggers only after
# GitHub Actions can start jobs successfully again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
