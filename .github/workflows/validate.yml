name: Project validation

# GitHub-hosted runners are currently blocked before startup by the account
# billing/spending restriction. This workflow is manual-only and has not been
# verified to run successfully. Netlify Deploy Previews are legacy and must not
# be used as a substitute CI service under the Oxford Cloudflare-first policy.
# Re-enable PR/push triggers only after GitHub Actions can start jobs successfully.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
