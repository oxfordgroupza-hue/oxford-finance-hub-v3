name: Oxford Finance Hub V3 CI

on:
  push:
    branches:
      - 'audit/**'
      - 'work/**'
      - 'production/**'
      - 'release/**'
      - 'recovery/**'
  pull_request:
    branches:
      - main
      - 'work/**'
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: oxford-finance-hub-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare Worker types
        run: pnpm exec wrangler types --config wrangler.production.jsonc

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint
