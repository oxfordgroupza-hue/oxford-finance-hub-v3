[build]
  # Publish the approved public site and isolated PR previews; keep finance intake, uploads, notifications and settlements disabled by runtime flags.
  ignore = 'if [ "$CONTEXT" = "deploy-preview" ] || [ "$CONTEXT" = "production" ]; then exit 1; fi; echo "Oxford Business Group V3 only publishes production and controlled deploy previews"; exit 0'
  command = "pnpm build && pnpm typecheck && pnpm test && pnpm lint"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"

[dev]
  framework = "#custom"
  command = "pnpm dev"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
