[build]
  # Allow isolated PR previews; hold production publishing until the production database and designated Super Administrator are safely provisioned.
  ignore = 'if [ "$CONTEXT" = "deploy-preview" ]; then exit 1; fi; echo "Oxford Business Group V3 production publishing is held pending production provisioning and acceptance"; exit 0'
  command = "pnpm build && pnpm typecheck && pnpm test && pnpm lint"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"

[dev]
  framework = "#custom"
  command = "pnpm dev"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
